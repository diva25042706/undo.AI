version: "3.9"

services:
  # PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: undo_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: undo_user
      POSTGRES_PASSWORD: undo_secret
      POSTGRES_DB: undo_ai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U undo_user -d undo_ai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 7 Cache and Lock Manager
  redis:
    image: redis:7-alpine
    container_name: undo_ai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # UNDO.AI FastAPI Engine
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: undo_ai_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://undo_user:undo_secret@postgres:5432/undo_ai_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: super-secure-undo-ai-secret-key-change-in-production-1234567890
      AI_PROVIDER: mock
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
